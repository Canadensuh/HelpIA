<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallSync - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-card: #111827;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --blue-primary: #3b82f6;
            --blue-hover: #60a5fa;
            --blue-dark: #1d4ed8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --font: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0f1a2e 0%, #080c18 100%);
        }

        /* ===== TELA DE LOGIN ===== */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            height: 100%;
        }

        .form {
            background: var(--bg-card);
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-radius: var(--radius);
            border: 2px solid var(--blue-primary);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form .author-credit {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .form .logo-login {
            margin-top: 8px;
        }

        .form .logo-login svg {
            width: 180px;
            height: auto;
        }

        .form .logo-login .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
        }

        .form .logo-login .logo-text span {
            color: var(--blue-primary);
        }

        .form .logo-login .logo-sub {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .form > p {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .separator {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0;
        }

        .separator > div {
            flex: 1;
            height: 1px;
            border-radius: 2px;
            background: #2a2a3a;
        }

        .separator > span {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 12px;
            padding: 0 6px;
            letter-spacing: 1px;
        }

        .oauthButton {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            height: 48px;
            border-radius: 8px;
            border: 2px solid #2a2a3a;
            background: #1a1a2e;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 250ms;
            position: relative;
            overflow: hidden;
            z-index: 1;
            justify-content: flex-start;
            padding-left: 20px;
        }

        .oauthButton::before {
            content: "";
            position: absolute;
            inset: 0;
            width: 0;
            background: var(--blue-primary);
            z-index: -1;
            transition: all 250ms;
        }

        .oauthButton:hover {
            color: #000;
            border-color: var(--blue-primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.25);
        }

        .oauthButton:hover::before {
            width: 100%;
        }

        .oauthButton .google-icon {
            width: 1.5rem;
            height: 1.5rem;
            filter: brightness(0) invert(1);
            transition: filter 250ms;
        }

        .oauthButton:hover .google-icon {
            filter: brightness(0) invert(0);
        }

        .oauthButton .icon {
            width: 1.5rem;
            height: 1.5rem;
            fill: currentColor;
        }

        .form > input {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            border: 2px solid #2a2a3a;
            background: #1a1a2e;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 0 16px;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }

        .form > input:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form > input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form .login-btn {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            border: none;
            background: var(--blue-primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
            letter-spacing: 0.5px;
        }

        .form .login-btn:hover {
            background: var(--blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
        }

        .form .login-btn:active {
            transform: scale(0.98);
        }

        .form .login-btn svg {
            transition: transform 0.3s;
        }

        .form .login-btn:hover svg {
            transform: translateX(4px);
        }

        .form .login-error {
            color: #ef4444;
            font-size: 14px;
            min-height: 24px;
            text-align: center;
            width: 100%;
        }

        .form .login-success {
            color: var(--blue-primary);
            font-size: 14px;
            min-height: 24px;
            text-align: center;
            width: 100%;
        }

        /* ===== ANIMAÇÃO DE CARREGAMENTO ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(8, 12, 24, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            backdrop-filter: blur(8px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a2e;
            border-top-color: var(--blue-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay .loading-text {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .loading-overlay .loading-logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 3px;
        }

        .loading-overlay .loading-logo span {
            color: var(--blue-primary);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .form {
                padding: 28px 20px;
            }

            .form .logo-login .logo-text {
                font-size: 26px;
            }

            .form .logo-login .logo-sub {
                font-size: 11px;
            }

            .form > p {
                font-size: 17px;
            }

            .oauthButton {
                font-size: 13px;
                padding-left: 14px;
                height: 44px;
            }

            .form > input {
                height: 44px;
                font-size: 14px;
            }

            .form .login-btn {
                height: 44px;
                font-size: 14px;
            }

            .form .author-credit {
                font-size: 10px;
                top: 12px;
                left: 14px;
            }
        }

        @media (max-width: 380px) {
            .form {
                padding: 20px 14px;
            }

            .form .logo-login .logo-text {
                font-size: 22px;
            }

            .form .logo-login .logo-sub {
                font-size: 9px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE CARREGAMENTO -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-logo">Call<span>Sync</span></div>
        <div class="spinner"></div>
        <div class="loading-text">Entrando...</div>
    </div>

    <!-- TELA DE LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="form">
            <div class="author-credit">Por: Murilo N.B</div>

            <div class="logo-login">
                <div class="logo-text">Call<span>Sync</span></div>
                <div class="logo-sub">Conecte-se</div>
            </div>

            <p>Bem-vindo de volta</p>

            <!-- Botão Google -->
            <button type="button" class="oauthButton" onclick="handleOAuth('Google')">
                <img src="https://res.cloudinary.com/oizv8icb/image/upload/v1787352466/google.png" alt="Google" class="google-icon">
                Continuar com Google
            </button>

            <!-- Botão Github -->
            <button type="button" class="oauthButton" onclick="handleOAuth('GitHub')">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
                Continuar com Github
            </button>

            <div class="separator">
                <div></div>
                <span>OU</span>
                <div></div>
            </div>

            <input type="text" placeholder="Usuário" id="loginUser">
            <input type="password" placeholder="Senha" id="loginPassword">

            <button type="button" class="login-btn" id="loginButton">
                Entrar
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            </button>

            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // USUÁRIOS PARA TESTE
        // ============================================================
        const users = [
            { id: 1, name: 'admin', pass: 'admin123' },
            { id: 2, name: 'usuario', pass: '123456' },
            { id: 3, name: 'teste', pass: 'teste123' }
        ];

        // ============================================================
        // ELEMENTOS
        // ============================================================
        const loginUser = document.getElementById('loginUser');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const loginButton = document.getElementById('loginButton');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // ============================================================
        // FUNÇÃO DE LOGIN
        // ============================================================
        function handleLogin() {
            const user = loginUser.value.trim();
            const pass = loginPassword.value.trim();


            loginError.textContent = '';
            loginSuccess.textContent = '';

            if (!user || !pass) {
                loginError.textContent = 'Preencha todos os campos.';
                return;
            }

            const found = users.find(u => u.name === user && u.pass === pass);

            if (found) {
                loginSuccess.textContent = '✅ Login realizado com sucesso!';
                loginError.textContent = '';

                loadingOverlay.classList.add('active');

                setTimeout(() => {
                    loadingOverlay.classList.remove('active');
                    alert(`🎉 Bem-vindo, ${found.name}!\n\nLogin realizado com sucesso no CallSync.\n\n(Esta é apenas uma demonstração da tela de login.)`);
                    
                    loginUser.value = '';
                    loginPassword.value = '';
                    loginSuccess.textContent = '';
                }, 2000);

            } else {
                loginError.textContent = '❌ Usuário ou senha inválidos. Tente novamente.';
                loginUser.focus();
                loginUser.select();
            }
        }

        function handleOAuth(provider) {
            loginError.textContent = '';
            loginSuccess.textContent = '';

            loadingOverlay.classList.add('active');

            setTimeout(() => {
                loadingOverlay.classList.remove('active');
                alert(`🔐 Autenticação via ${provider} simulada!\n\n(Esta é apenas uma demonstração da tela de login.)`);
            }, 1500);
        }

        loginButton.addEventListener('click', handleLogin);

        loginUser.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        loginPassword.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        console.log('🔑 Credenciais para teste:');
        users.forEach(u => {
            console.log(`   👤 ${u.name}  |  🔒 ${u.pass}`);
        });
        console.log('📌 Digite qualquer uma das credenciais acima para fazer login.');
        console.log('🎵 CallSync - Tela de Login (versão demonstrativa)');
    </script>

</body>
</html>
