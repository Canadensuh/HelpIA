<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HelpIA">
  <!-- Logo do HelpIA: o rosto do Helpy (o mesmo robô do escritório) -->
  <defs>
    <linearGradient id="cabeca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD27F"/><stop offset="1" stop-color="#C9A94A"/>
    </linearGradient>
  </defs>
  <!-- antena -->
  <line x1="32" y1="14" x2="32" y2="6.5" stroke="#23291B" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="32" cy="5.5" r="3.6" fill="#E8735C" stroke="#23291B" stroke-width="1.8"/>
  <!-- orelhas -->
  <rect x="3" y="27" width="6.5" height="14" rx="3" fill="#23291B"/>
  <rect x="54.5" y="27" width="6.5" height="14" rx="3" fill="#23291B"/>
  <!-- sombra de adesivo + cabeça -->
  <rect x="9.5" y="15.5" width="48" height="44" rx="15" fill="#0A0D07"/>
  <rect x="7.5" y="13.5" width="48" height="44" rx="15" fill="url(#cabeca)" stroke="#23291B" stroke-width="2.6"/>
  <!-- visor -->
  <rect x="14" y="22" width="35" height="23" rx="10" fill="#10140C" stroke="#23291B" stroke-width="1.4"/>
  <!-- olhos e sorriso de fósforo -->
  <ellipse cx="24" cy="31.5" rx="3.6" ry="4.3" fill="#A6F08A"/>
  <ellipse cx="39" cy="31.5" rx="3.6" ry="4.3" fill="#A6F08A"/>
  <path d="M26 38.5q5.5 4 11 0" fill="none" stroke="#A6F08A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- bochechas -->
  <circle cx="16" cy="50" r="2.3" fill="#E8735C" opacity=".6"/>
  <circle cx="47" cy="50" r="2.3" fill="#E8735C" opacity=".6"/>
</svg>
