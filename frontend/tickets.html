<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpIA — Tickets em Aberto</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/simbolos.css" />
  <link rel="stylesheet" href="css/icones.css" />
  <link rel="stylesheet" href="css/helpy.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/mesa.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <link rel="stylesheet" href="css/teclas.css" />
  <link rel="stylesheet" href="css/papelaria.css" />
  <link rel="stylesheet" href="css/cracha.css" />
  <link rel="stylesheet" href="css/conta.css" />
  <link rel="stylesheet" href="css/celular.css" />
</head>
<body class="tela-mesa tela-pagina tela-abertos">

  <header class="mesa-topo">
    <a href="index.html" class="brand" data-inicio><img src="assets/logo.svg" alt="" /><span class="brand-nome">Help<b>IA</b></span></a>
    <div class="topbar-acoes">
      <div class="usuario-menu">
        <span class="usuario-avatar" data-usuario-iniciais aria-hidden="true"></span>
        <span class="usuario-info"><strong data-usuario-nome></strong><span data-usuario-perfil></span></span>
        <button type="button" class="btn-sair" data-acao="sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="mesa pagina-cheia">
    <header class="area-topo centro-topo">
      <h2 id="tituloPagina"><i class="ic ic-entrada" aria-hidden="true"></i> Tickets em Aberto <span class="contador" id="contador">0</span></h2>
      <span class="pagina-sub" id="subtitulo"></span>
    </header>
    <section class="tampo pagina-tampo" aria-labelledby="tituloPagina">
      <div class="filtros-barra">
        <label class="busca-campo"><i class="ic ic-olho" aria-hidden="true"></i>
          <input id="busca" class="input" type="search" placeholder="Buscar por #ID, colaborador ou problema…" autocomplete="off" /></label>
        <div class="filtros" role="group" aria-label="Prioridade" id="filtroPrioridade">
          <button type="button" class="filtro ativo" data-prioridade="">Todas</button>
          <button type="button" class="filtro pri-chip pri-alta" data-prioridade="alta"><i class="cor"></i>Alta</button>
          <button type="button" class="filtro pri-chip pri-media" data-prioridade="media"><i class="cor"></i>Média</button>
          <button type="button" class="filtro pri-chip pri-normal" data-prioridade="normal"><i class="cor"></i>Normal</button>
          <button type="button" class="filtro pri-chip pri-baixa" data-prioridade="baixa"><i class="cor"></i>Baixa</button>
        </div>
        <select id="filtroTipo" class="input" aria-label="Filtrar por tipo"></select>
        <select id="filtroStatus" class="input" aria-label="Filtrar por situação">
          <option value="">Na fila e em atendimento</option>
          <option value="Aguardando">Só na fila</option>
          <option value="Em atendimento">Só em atendimento</option>
        </select>
        <select id="filtroAnalista" class="input" aria-label="Filtrar por analista"></select>
        <span class="resumo-filtro" id="resumo"></span>
      </div>
      <div class="grade-rolagem"><ul class="lista-tickets desktop-tickets" id="lista"></ul></div>
    </section>
  </main>

  <p class="aviso-offline aviso-flutuante" id="avisoOffline" hidden></p>

  <script src="js/catalogo.js"></script>
  <script src="js/simulador.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpy.js"></script>
  <script src="js/ticket-ui.js"></script>
  <script src="js/abertos.js"></script>
</body>
</html>
