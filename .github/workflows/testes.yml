name: Testes do backend

# Roda os testes (pytest) no GitHub a cada push e pull request:
# assim dá para conferir o backend mesmo sem Python instalado na máquina.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar os testes
        run: python -m pytest -q
